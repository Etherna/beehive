version: "3.8"
services:

  beehive:
    image: etherna/beehive:latest
    stop_grace_period: 60s   # beehive cancels its running jobs on stop: let its shutdown (up to 30s) finish before the kill, docker's default is 10s
    environment:
      - ConnectionStrings__BeehiveDb=mongodb://mongo/beehive                        # application db
      - ConnectionStrings__DataProtectionDb=mongodb://mongo/beehiveDataProtection   # system db
      - ConnectionStrings__HangfireDb=mongodb://mongo/beehiveHangfire               # async worker db
    networks:
      - mongo-net
    ports:
      - 1633:1633
    restart: unless-stopped

  mongo:
    hostname: mongo
    image: mongo:5.0
    volumes:
      - mongo-configdb:/data/configdb
      - mongo-db:/data/db
    networks:
      - mongo-net
    restart: unless-stopped
    entrypoint: [ "/usr/bin/mongod", "--bind_ip_all" ]

networks:
  mongo-net:
  
volumes:
  mongo-configdb:
  mongo-db:
